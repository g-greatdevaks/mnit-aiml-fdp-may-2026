global:
  scrape_interval: 2s # Fast scraping interval for demo response in Grafana
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'agent_metrics'
    static_configs:
      # Scrapes the Prometheus exporter server running on the host machine (e.g. at port 8000)
      - targets: ['host.docker.internal:8000']
