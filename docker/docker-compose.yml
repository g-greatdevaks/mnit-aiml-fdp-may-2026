version: '3.8'

services:
  # Jaeger All-in-One container (Tracing UI & OTLP Collector)
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: jaeger-telemetry
    ports:
      - "16686:16686" # Web UI dashboard
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Prometheus (Metrics Scraper & Database)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus-metrics
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:

      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # Grafana (Visual dashboards)
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana-dashboards
    ports:
      - "3000:3000" # Web UI dashboard (user: admin / pass: admin)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
